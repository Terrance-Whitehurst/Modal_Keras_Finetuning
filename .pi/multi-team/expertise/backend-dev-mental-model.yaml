# ── VERIFIED keras-hub API ────────────────────────────────────────────────
keras_hub:
  version: "0.28.0"
  detection_models:
    - DFineBackbone
    - DFineObjectDetector          # ← USE THIS
    - DFineObjectDetectorPreprocessor
    - ImageObjectDetector          # abstract base
    - ObjectDetector               # abstract base
    - RetinaNetBackbone
    - RetinaNetObjectDetector
    - RetinaNetObjectDetectorPreprocessor
  NOT_present:
    - YOLOV8Detector               # DOES NOT EXIST — planning was wrong
    - YOLOv8                       # DOES NOT EXIST

  dfine_api:
    presets:
      - dfine_nano_coco    # 3.75M params — fastest, use for tutorial
      - dfine_small_coco   # 10.25M params
      - dfine_medium_coco
      - dfine_large_coco
      - dfine_xlarge_coco
    correct_instantiation: |
      # Step 1: load pretrained backbone
      backbone = keras_hub.models.DFineBackbone.from_preset("dfine_nano_coco")
      # Step 2: build detector with new head (num_classes for your dataset)
      model = keras_hub.models.DFineObjectDetector(
          backbone=backbone,
          num_classes=N,
          bounding_box_format="xywh",
      )
      # Step 3: compile
      model.compile(optimizer=keras.optimizers.AdamW(learning_rate=1e-4))
    wrong_instantiation: |
      # FAILS — loads 80-class COCO weights, shape mismatch on classification head
      model = keras_hub.models.DFineObjectDetector.from_preset("dfine_nano_coco", num_classes=N)
    freeze_unfreeze: "model.backbone.trainable = False  # then True to unfreeze"
    training_data_format:
      type: "tf.data.Dataset"
      yields: "(images_float32, {'boxes': boxes_xywh, 'labels': labels_int32})"
      images_shape: "[batch, H, W, 3]  float32"
      boxes_shape: "[batch, max_objects, 4]  float32, xywh absolute pixels, pad unused with -1"
      labels_shape: "[batch, max_objects]  int32, pad unused with -1"
      note: "train_on_batch does NOT work with dict y — must use model.fit() + tf.data.Dataset"
    inference_output:
      keys: [boxes, confidence, labels, num_detections]
      boxes_shape: "[batch, 300, 4]  xywh absolute"
      confidence_shape: "[batch, 300]  float32"
      labels_shape: "[batch, 300]  int32"
      num_detections_shape: "[batch]  int32"
    tested_and_working: true

# ── VERIFIED HuggingFace dataset ─────────────────────────────────────────
